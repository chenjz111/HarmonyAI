name: Minimal offline PR CI

on:
  pull_request:
    branches: [team/s7-m1-w2-baseline]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  guarded-tests:
    name: Offline backend (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout PR merge context (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified official tag
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified official tag
        with:
          python-version: '3.12'
      - name: Install declared test dependencies (networked setup, NOT offline evidence)
        run: python -m pip install -r requirements-test.txt
      - name: Launcher integration tests (only guarded child probes)
        run: python -B -m unittest discover -s tools/ci/tests -p test_launcher.py -v
      - name: Offline guard selftests
        run: python -B tools/ci/run.py --suite guard --evidence-dir "$RUNNER_TEMP/harmonyai-ci/guard"
      - name: Offline eight-file backend regression (not the full repository suite)
        run: python -B tools/ci/run.py --suite regression --evidence-dir "$RUNNER_TEMP/harmonyai-ci/regression"
      - name: Runtime auth/config specialty (explicit NOT_INCLUDED if absent)
        run: python -B tools/ci/run.py --suite hardening --evidence-dir "$RUNNER_TEMP/harmonyai-ci/hardening"
      - name: BE-2B PlaybackProof and Epoch CAS specialty
        run: python -B tools/ci/run.py --suite be2b --evidence-dir "$RUNNER_TEMP/harmonyai-ci/be2b"
      - name: Formal 0013 and Feedback transaction specialty (72 fixed tests)
        run: python -B tools/ci/run.py --suite feedback --evidence-dir "$RUNNER_TEMP/harmonyai-ci/feedback"
      - name: Five independent-process feedback/Clear race scenarios
        run: python -B tools/ci/run_feedback_processes.py --evidence-dir "$RUNNER_TEMP/harmonyai-ci/feedback-processes"
      - name: Node 24 for offline frontend specialty
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified official tag
        with:
          node-version: '24'
      - name: Offline frontend feedback and single Player specialty (84 fixed tests)
        run: python -B tools/ci/run_frontend.py --suite feedback --evidence-dir "$RUNNER_TEMP/harmonyai-ci/frontend"
      - name: Upload sanitized logs and counts, never databases or credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified official tag
        with:
          name: offline-pr-ci-${{ matrix.os }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/harmonyai-ci/frontend/*.log
            ${{ runner.temp }}/harmonyai-ci/frontend/results.json
            ${{ runner.temp }}/harmonyai-ci/*/pytest.log
            ${{ runner.temp }}/harmonyai-ci/*/command.json
            ${{ runner.temp }}/harmonyai-ci/*/result.json
            ${{ runner.temp }}/harmonyai-ci/*/telemetry.json
            ${{ runner.temp }}/harmonyai-ci/feedback-processes/*.log
            ${{ runner.temp }}/harmonyai-ci/feedback-processes/*/*.telemetry.json
