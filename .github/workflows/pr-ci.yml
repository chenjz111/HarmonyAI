name: Minimal offline PR CI

on:
  pull_request:
    branches: [team/s7-m1-w2-baseline]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  guarded-tests:
    name: Offline backend (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout PR merge context (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified official tag
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified official tag
        with:
          python-version: '3.12'
      - name: Install declared test dependencies (networked setup, NOT offline evidence)
        run: python -m pip install -r requirements-test.txt
      - name: Launcher integration tests (only guarded child probes)
        run: |
          python -B -m unittest discover -s tools/ci/tests -p test_launcher.py -v
          python -B -m unittest discover -s tools/ci/tests -p test_h5_audit.py -v
      - name: Offline guard selftests
        run: python -B tools/ci/run.py --suite guard --evidence-dir "$RUNNER_TEMP/harmonyai-ci/guard"
      - name: Offline eight-file backend regression (not the full repository suite)
        run: python -B tools/ci/run.py --suite regression --evidence-dir "$RUNNER_TEMP/harmonyai-ci/regression"
      - name: Runtime auth/config specialty (explicit NOT_INCLUDED if absent)
        run: python -B tools/ci/run.py --suite hardening --evidence-dir "$RUNNER_TEMP/harmonyai-ci/hardening"
      - name: BE-2B PlaybackProof and Epoch CAS specialty
        run: python -B tools/ci/run.py --suite be2b --evidence-dir "$RUNNER_TEMP/harmonyai-ci/be2b"
      - name: Formal migrations, Feedback and historical analysis (fixed inventory)
        run: python -B tools/ci/run.py --suite feedback --evidence-dir "$RUNNER_TEMP/harmonyai-ci/feedback"
      - name: Five independent-process feedback/Clear race scenarios
        run: python -B tools/ci/run_feedback_processes.py --evidence-dir "$RUNNER_TEMP/harmonyai-ci/feedback-processes"
      - name: Account Security R1 and identity continuity (fixed inventory, public routes remain closed)
        run: python -B tools/ci/run.py --suite account --evidence-dir "$RUNNER_TEMP/harmonyai-ci/account"
      - name: Account independent-process refresh/bind/limit races
        run: python -B tools/ci/run_account_processes.py --evidence-dir "$RUNNER_TEMP/harmonyai-ci/account-processes"
      - name: Full offline backend regression (all tests, unchanged Guard)
        run: python -B tools/ci/run.py --suite full --evidence-dir "$RUNNER_TEMP/harmonyai-ci/backend-full"
      - name: Node 24 for offline frontend specialty
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified official tag
        with:
          node-version: '24'
      - name: Install locked frontend test dependencies (networked setup, NOT offline evidence)
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Offline frontend feedback, Player, Android wiring and restored assets (fixed inventory)
        run: python -B tools/ci/run_frontend.py --suite feedback --evidence-dir "$RUNNER_TEMP/harmonyai-ci/frontend"
      - name: Full offline frontend regression (no missing-asset skips)
        run: python -B tools/ci/run_frontend.py --suite full --evidence-dir "$RUNNER_TEMP/harmonyai-ci/frontend-full"
      - name: Offline H5 compiler and byte-identical static bundle verification
        run: python -B tools/ci/run_h5.py --evidence-dir "$RUNNER_TEMP/harmonyai-ci/h5"
      - name: Integration watchdog rejects stalled pipe readers
        run: python -B -m unittest discover -s tools/ci/tests -p test_journey_deadline.py
      - name: Actual My, Player and feedback pages against isolated ASGI (no response fixtures)
        run: python -B tools/ci/run_journey.py --evidence-dir "$RUNNER_TEMP/harmonyai-ci/journey"
      - name: Account R1 transport and startup against isolated native router (not platform acceptance)
        run: python -B tools/ci/run_journey.py --scenario account --evidence-dir "$RUNNER_TEMP/harmonyai-ci/account-journey"
      - name: Android-context Guest music wiring against ASGI (no APK or device acceptance)
        run: python -B tools/ci/run_journey.py --scenario android --evidence-dir "$RUNNER_TEMP/harmonyai-ci/android-journey"
      - name: Upload sanitized logs and counts, never databases or credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified official tag
        with:
          name: offline-pr-ci-${{ matrix.os }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/harmonyai-ci/frontend/*.log
            ${{ runner.temp }}/harmonyai-ci/frontend/results.json
            ${{ runner.temp }}/harmonyai-ci/frontend-full/*.log
            ${{ runner.temp }}/harmonyai-ci/frontend-full/results.json
            ${{ runner.temp }}/harmonyai-ci/h5/*.log
            ${{ runner.temp }}/harmonyai-ci/h5/*.jsonl
            ${{ runner.temp }}/harmonyai-ci/*/pytest.log
            ${{ runner.temp }}/harmonyai-ci/*/command.json
            ${{ runner.temp }}/harmonyai-ci/*/result.json
            ${{ runner.temp }}/harmonyai-ci/*/telemetry.json
            ${{ runner.temp }}/harmonyai-ci/account-processes/*.log
            ${{ runner.temp }}/harmonyai-ci/account-processes/*/*.telemetry.json
            ${{ runner.temp }}/harmonyai-ci/feedback-processes/*.log
            ${{ runner.temp }}/harmonyai-ci/feedback-processes/*/*.telemetry.json
            ${{ runner.temp }}/harmonyai-ci/journey/frontend.log
            ${{ runner.temp }}/harmonyai-ci/journey/backend.log
            ${{ runner.temp }}/harmonyai-ci/account-journey/frontend.log
            ${{ runner.temp }}/harmonyai-ci/account-journey/backend.log
            ${{ runner.temp }}/harmonyai-ci/android-journey/frontend.log
            ${{ runner.temp }}/harmonyai-ci/android-journey/backend.log
