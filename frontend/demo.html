<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HarmonyAI — 五音疗愈</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, sans-serif; background: #F8F8F8; min-height:100vh; }
.container { max-width:480px; margin:0 auto; padding:24px 16px 100px; }
.header { text-align:center; margin-bottom:28px; }
.header h1 { font-size:24px; color:#534AB7; }
.header p { font-size:13px; color:#888; margin-top:6px; }

.card { background:#fff; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
.card-title { font-size:16px; font-weight:600; color:#2C2C2A; margin-bottom:12px; }
.hint { font-size:12px; color:#999; margin-bottom:12px; line-height:1.6; }

textarea { width:100%; min-height:140px; background:#F8F8F8; border:1px solid #E8E8E8; border-radius:10px; padding:14px; font-size:14px; color:#2C2C2A; resize:vertical; font-family:inherit; }
textarea:focus { outline:none; border-color:#534AB7; }
.char-count { text-align:right; font-size:11px; color:#ccc; margin-top:6px; }

.btn { width:100%; height:48px; border-radius:24px; border:none; font-size:16px; font-weight:600; cursor:pointer; transition:all 0.2s; }
.btn-primary { background:#534AB7; color:#fff; }
.btn-primary:hover { background:#4539A3; }
.btn-primary:disabled { background:#C8C5E8; cursor:not-allowed; }

.loading { text-align:center; padding:40px 0; }
.spinner { width:40px; height:40px; border:4px solid #E8E8E8; border-top-color:#534AB7; border-radius:50%; margin:0 auto 16px; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.result-block { margin-top:16px; }
.result-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #F0F0F0; }
.result-label { font-size:14px; color:#2C2C2A; }
.result-value { font-size:14px; font-weight:600; color:#534AB7; }

.emotion-bar { margin:6px 0; }
.emotion-row { display:flex; align-items:center; margin:8px 0; gap:10px; }
.emotion-name { width:60px; font-size:13px; color:#2C2C2A; text-align:right; }
.emotion-track { flex:1; height:8px; background:#F0F0F0; border-radius:4px; overflow:hidden; }
.emotion-fill { height:100%; border-radius:4px; transition:width 0.5s; }
.emotion-score { width:40px; font-size:12px; color:#888; }

.severe { background:#E74C3C; }
.medium { background:#F39C12; }
.mild { background:#2ECC71; }

.warning-box { background:#FFF8E1; border:1px solid #FFE082; border-radius:8px; padding:10px 14px; margin-top:12px; font-size:12px; color:#B8860B; }

.error-box { background:#FFEBEE; border:1px solid #EF9A9A; border-radius:8px; padding:14px; text-align:center; color:#C62828; }

.music-player { text-align:center; padding:10px 0; }
.music-player audio { width:100%; margin-top:8px; }

.step-indicator { display:flex; justify-content:center; gap:6px; margin-top:14px; }
.step-dot { width:8px; height:8px; border-radius:50%; background:#E0E0E0; }
.step-dot.active { background:#534AB7; }
</style>
</head>
<body>
<div class="container" id="app">

  <!-- Header -->
  <div class="header">
    <h1>HarmonyAI</h1>
    <p>中医五音疗愈 · AI 驱动的音乐处方</p>
  </div>

  <!-- Step 1: Input -->
  <div class="card" id="input-card">
    <div class="card-title">说说你的近况</div>
    <p class="hint">告诉AI你最近经历了什么、心情怎么样、身体有什么不舒服。越详细，AI 越能理解你。</p>
    <textarea id="freeText" placeholder="比如：这两周工作压力特别大，老板催项目催得紧，昨晚又失眠了到凌晨三点，今天整个人都很烦躁，胸口闷闷的，完全不想跟任何人说话..."></textarea>
    <p class="char-count"><span id="charCount">0</span>/500</p>
    <button class="btn btn-primary" id="submitBtn" onclick="analyze()">开始分析</button>
  </div>

  <!-- Step 2: Loading -->
  <div class="card loading" id="loading-card" style="display:none">
    <div class="spinner"></div>
    <p style="color:#888;font-size:14px;">AI 正在分析你的状态...</p>
    <div class="step-indicator">
      <div class="step-dot active" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
      <div class="step-dot" id="dot3"></div>
      <div class="step-dot" id="dot4"></div>
    </div>
  </div>

  <!-- Step 3: Results -->
  <div id="results-area" style="display:none">

    <!-- Emotion Profile -->
    <div class="card" id="emotion-card">
      <div class="card-title">情绪画像</div>
      <div id="emotionBars"></div>
      <div class="result-block">
        <div class="result-item">
          <span class="result-label">主导情绪</span>
          <span class="result-value" id="dominant"></span>
        </div>
        <div class="result-item">
          <span class="result-label">AI 可信度</span>
          <span class="result-value" id="confidence"></span>
        </div>
      </div>
      <div class="warning-box" id="degraded-warning" style="display:none"></div>
    </div>

    <!-- Diagnosis -->
    <div class="card" id="diagnosis-card">
      <div class="card-title">中医辨证</div>
      <div id="diagnosisContent"></div>
    </div>

    <!-- Prescription -->
    <div class="card" id="prescription-card">
      <div class="card-title">音乐处方</div>
      <div id="prescriptionContent"></div>
    </div>

    <!-- Music Player -->
    <div class="card music-player" id="music-card">
      <div class="card-title">疗愈音乐</div>
      <audio controls autoplay id="audioPlayer">
        <source id="audioSource" src="" type="audio/wav">
      </audio>
    </div>

    <!-- Retry -->
    <button class="btn btn-primary" style="margin-top:16px;background:#F1EFE8;color:#5F5E5A;" onclick="resetForm()">重新分析</button>
  </div>

</div>

<script>
const BASE_URL = 'http://localhost:8000';

// Char counter
document.getElementById('freeText').addEventListener('input', function() {
  document.getElementById('charCount').textContent = this.value.length;
});

function resetForm() {
  document.getElementById('input-card').style.display = 'block';
  document.getElementById('loading-card').style.display = 'none';
  document.getElementById('results-area').style.display = 'none';
  document.getElementById('submitBtn').disabled = false;
}

async function analyze() {
  const freeText = document.getElementById('freeText').value.trim();
  if (!freeText) {
    alert('请先描述一下你的近况');
    return;
  }

  // Show loading
  document.getElementById('input-card').style.display = 'none';
  document.getElementById('results-area').style.display = 'none';
  document.getElementById('loading-card').style.display = 'block';
  document.getElementById('submitBtn').disabled = true;

  try {
    // Step 1: Assessment
    updateDot(0);
    const assessResp = await fetch(`${BASE_URL}/api/v1/assessment`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ questionnaire: { free_text: freeText } })
    });
    const assessment = await assessResp.json();
    updateDot(1);

    // Display emotion profile
    const ep = assessment.output.emotion_profile || {};
    const dims = ep.dimensions || {};
    let barsHtml = '';
    const sorted = Object.entries(dims).sort((a,b) => b[1].score - a[1].score);
    const colors = {severe:'#E74C3C', medium:'#F39C12', mild:'#2ECC71'};
    for (const [name, info] of sorted) {
      const color = colors[info.severity] || '#534AB7';
      barsHtml += `<div class="emotion-row">
        <span class="emotion-name">${name}</span>
        <div class="emotion-track"><div class="emotion-fill" style="width:${info.score}%;background:${color}"></div></div>
        <span class="emotion-score">${info.score}分 ${info.severity==='severe'?'重度':info.severity==='medium'?'中度':'轻度'}</span>
      </div>`;
    }
    document.getElementById('emotionBars').innerHTML = barsHtml;
    document.getElementById('dominant').textContent = `${ep.dominant_emotion} ${ep.dominant_score}分`;
    document.getElementById('confidence').textContent = `${Math.round(assessment.confidence * 100)}%`;

    if (assessment.degradation_triggered || assessment.status === 'degraded') {
      const w = document.getElementById('degraded-warning');
      w.style.display = 'block';
      w.textContent = '当前使用规则引擎（Qwen不可用或失败）';
    }

    // Step 2: Diagnosis
    updateDot(1);
    const diagResp = await fetch(`${BASE_URL}/api/v1/diagnosis`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ session_id: assessment.session_id, assessment: assessment })
    });
    const diagnosis = await diagResp.json();
    updateDot(2);

    const primary = (diagnosis.output?.syndrome_diagnosis || {}).primary || {};
    document.getElementById('diagnosisContent').innerHTML = `
      <div class="result-item"><span class="result-label">证型</span><span class="result-value">${primary.name || '—'}</span></div>
      <div class="result-item"><span class="result-label">五行</span><span class="result-value">${primary.element || '—'}（${primary.organ || '—'}）</span></div>
      <div class="result-item"><span class="result-label">严重程度</span><span class="result-value">${primary.severity_name || '—'}</span></div>
      <div class="result-item"><span class="result-label">可信度</span><span class="result-value">${Math.round(diagnosis.confidence * 100)}%</span></div>
    `;

    // Step 3: Prescription
    updateDot(2);
    const rxResp = await fetch(`${BASE_URL}/api/v1/prescription`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ session_id: assessment.session_id, diagnosis: diagnosis })
    });
    const prescription = await rxResp.json();
    updateDot(3);

    const mf = prescription.output?.music_feature || {};
    const pt = prescription.output?.prompt_template || {};
    document.getElementById('prescriptionContent').innerHTML = `
      <div class="result-item"><span class="result-label">调式</span><span class="result-value">${mf.tone_name || '—'}（${mf.tone_id || ''}）</span></div>
      <div class="result-item"><span class="result-label">BPM</span><span class="result-value">${mf.bpm || '—'}</span></div>
      <div class="result-item"><span class="result-label">乐器</span><span class="result-value">${(mf.instruments||[]).join('、') || '—'}</span></div>
      <div class="result-item"><span class="result-label">时长</span><span class="result-value">${mf.duration_minutes || '?'} 分钟</span></div>
      <div class="result-item"><span class="result-label">Prompt</span><span class="result-value" style="font-size:11px;max-width:200px;text-align:right;">${(pt.text||'').slice(0,60)}...</span></div>
    `;

    // Step 4: Audio
    updateDot(3);
    const genResp = await fetch(`${BASE_URL}/api/v1/generation`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ session_id: assessment.session_id, prescription: prescription })
    });
    const generation = await genResp.json();

    const audioUrl = (generation.output?.audio || {}).url;
    if (audioUrl) {
      document.getElementById('audioSource').src = BASE_URL + audioUrl;
      document.getElementById('audioPlayer').load();
    }

    // Show results
    document.getElementById('loading-card').style.display = 'none';
    document.getElementById('results-area').style.display = 'block';

  } catch (err) {
    document.getElementById('loading-card').style.display = 'none';
    document.getElementById('results-area').style.display = 'block';
    document.getElementById('results-area').innerHTML = `
      <div class="card error-box">
        <p>请求失败：${err.message}</p>
        <p style="font-size:12px;margin-top:8px;">请确认后端已在 http://localhost:8000 启动</p>
        <button class="btn btn-primary" style="margin-top:12px;" onclick="resetForm()">重试</button>
      </div>`;
  }
}

function updateDot(n) {
  for (let i = 0; i < 4; i++) {
    document.getElementById('dot'+(i+1)).className = 'step-dot' + (i <= n ? ' active' : '');
  }
}
</script>
</body>
</html>
